<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗봇 친구 - 학교 도서관</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <span>📚</span>
            즐거운 학교 도서관
        </a>
        <nav>
            <ul>
                <li><a href="index.html">홈</a></li>
                <li><a href="story.html">스토리</a></li>
                <li><a href="chatbot.html" class="active">챗봇 친구</a></li>
                <li><a href="game.html">미니 게임</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>🤖 도서관 챗봇 친구 🤖</h1>
        <p style="text-align: center; margin-bottom: 2rem; font-size: 1.5rem; color: #555;">
            "구름빵"이나 "무지개 물고기"에 대해 궁금한 점을 물어보세요!
        </p>
        
        <div class="chat-container">
            <div class="chat-box" id="chat-box">
                <div class="message bot">
                    안녕! 나는 도서관 요정이야. "구름빵"이나 "무지개 물고기"에 대해 이야기해볼까? 어떤게 궁금해?
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="여기에 질문을 입력하세요..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">보내기 🚀</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 즐거운 초등학교 도서관. 책과 함께 꿈을 키워요! ✨</p>
    </footer>

    <script src="js/chatbot.js"></script>
</body>
</html>
