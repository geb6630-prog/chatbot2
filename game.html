<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 게임 - 학교 도서관</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <span>📚</span>
            즐거운 학교 도서관
        </a>
        <nav>
            <ul>
                <li><a href="index.html">홈</a></li>
                <li><a href="story.html">스토리</a></li>
                <li><a href="chatbot.html">챗봇 친구</a></li>
                <li><a href="game.html" class="active">미니 게임</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>🎮 신나는 미니 게임 🎮</h1>
        <p style="text-align: center; margin-bottom: 2rem; font-size: 1.3rem;">
            어떤 게임을 해볼까요? 아래 버튼을 눌러보세요!
        </p>

        <div class="game-wrapper">
            <div class="game-controls">
                <button class="btn-game" onclick="startGame('cloud')">☁️ 구름빵 잡기</button>
                <button class="btn-game" onclick="startGame('fish')">🐟 무지개 비늘 나누기</button>
            </div>
            
            <div class="game-area">
                <canvas id="gameCanvas" width="600" height="400" style="display: none;"></canvas>
                <div id="gameStartMsg" style="width: 600px; height: 400px; background-color: var(--background-color); border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; color: #666; border: 2px dashed #aaa;">
                    위의 버튼을 눌러 게임을 시작하세요!
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 즐거운 초등학교 도서관. 책과 함께 꿈을 키워요! ✨</p>
    </footer>

    <script src="js/game.js"></script>
</body>
</html>
